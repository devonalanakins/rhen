name: Rhen M0 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run M0 tests
        run: npm test
      - name: Check Python emission
        run: node bin/rhen.mjs examples/hello.rn --target python | python3
