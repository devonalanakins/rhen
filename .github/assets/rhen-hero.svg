<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">Rhen language research</title>
<desc id="desc">Rhen relation-code symbol and source text connected to structured program nodes on a precision grid.</desc>
